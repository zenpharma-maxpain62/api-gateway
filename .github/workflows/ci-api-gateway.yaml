name: ci-api-gateway

on:
  push:
    branches: [develop, 'release/**']
  
  workflow_dispatch:

permissions:
  id-token: write
  content: read
  security-event: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      content: read
      actions: read

    steps:
      - name: checkout
        uses: actions/checkout@5

      - name: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: maven compile test package
        run: mvn verify --no-transfer-progress