name: ci-api-gateway

on: 
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v6
        with:
          destribution: temurin
          java-version: 17
          cache: maven
        
      - name: build
        run: mvn verify --no-transfer-progress