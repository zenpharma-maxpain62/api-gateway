name: ci-api-gateway

on: 
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tag
        id: fetch-tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: show tag
        run: echo '${{ steps.fetch-tag.outputs.tag }}'

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: maven - compile build test
        run: mvn verify --no-transfer-progress

      - name: sonarqube - SAST + code quality
        uses: SonarSource/sonarqube-scan-action@da4450e400cebf84292b12a85d4ca0080ae2938c
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_API_GATEWAY }}
            -Dsonar.java.binaries=target/classes

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::134448505602:role/zenpharma-dev-github-actions-role
          aws-region: ap-south-1
      
      - name: login to aws ecr
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: build and push docker image
        id: image-build-push
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.fetch-tag.outputs.tag }}"
          docker build -t $IMAGE .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-build-push.outputs.image}}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: push image
        id push-image
        run: |
          IMAGE="${{ steps.image-build-push.outputs.image}}"
          docker push $IMAGE


